<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head_fragment(
        title='ユーザー情報一覧',
        scripts=~{},
        links=~{::link}
    )}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body>
    <div id="overlay" class="overlay"></div>

    <!-- サイドバーは1回だけ読み込む -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="container">
        <h1>ユーザー情報管理画面</h1>

        <div th:if="${validationError != null}">
            <p th:each="error : ${validationError}"
               th:text="${error}"
               class="text-danger"></p>
        </div>

        <form th:action="@{/user/search}"
              th:object="${userSearchRequest}"
              method="post">

            <div class="form-group">
                <label for="id">ID</label>
                <input type="text"
                       class="w-25 form-control"
                       th:field="*{id}">

                <label for="name">名前</label>
                <input type="text"
                       class="w-50 form-control"
                       th:field="*{name}">
            </div>

            <br>
            <button type="submit" class="btn btn-primary">検索</button>
        </form>

        <div th:if="${userlist != null}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名前</th>
                        <th>メールアドレス</th>
                        <th>ステータス</th>
                        <th>更新日時</th>
                        <th>登録日時</th>
                        <th>操作</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="user : ${userlist}"
                        class="align-middle">

                        <td th:text="${user.userId}"></td>
                        <td th:text="${user.userName}"></td>
                        <td th:text="${user.mailAddress}"></td>
                        <td th:text="${user.status}"></td>

                        <td th:text="${user.updateDatetime != null
                            ? #temporals.format(user.updateDatetime, 'yyyy/MM/dd')
                            : ''}"></td>

                        <td th:text="${user.createDatetime != null
                            ? #temporals.format(user.createDatetime, 'yyyy/MM/dd')
                            : ''}"></td>

                        <td>
                            <a th:href="@{/user/{id}/edit(id=${user.userId})}"
                               class="btn btn-primary">
                                編集
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:src="@{/js/sidebar.js}"></script>
</body>

</html>
