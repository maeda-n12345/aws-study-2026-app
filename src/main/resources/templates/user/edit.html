<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head_fragment(
        title='ユーザーステータス更新',
        scripts=~{},
        links=~{::link}
    )}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <!-- サイドバーは1回だけ読み込む -->
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <div class="container">
    <h1>ユーザーステータス更新</h1>

    <!-- 入力エラー・更新競合のメッセージ -->
    <div th:if="${validationError != null}">
      <p th:each="error : ${validationError}" th:text="${error}" class="text-danger"></p>
    </div>

    <form th:action="@{/user/status/update}" th:object="${userUpdateRequest}" method="post">

      <!-- 更新対象と、編集開始時点のバージョン -->
      <input type="hidden" th:field="*{userId}">
      <input type="hidden" th:field="*{version}">

      <div class="row mb-3">
        <div class="col-3 pt-3 border bg-light">
          ステータス<span class="text-danger">※</span>
        </div>

        <div class="col border p-2">
          <select class="form-select" th:field="*{status}">
            <option value="">選択してください</option>
            <option value="0">無効</option>
            <option value="1">有効</option>
          </select>
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary">
          更新
        </button>

        <a th:href="@{/user/list}" class="btn btn-secondary">
          キャンセル
        </a>
      </div>
    </form>
  </div>

  <script th:src="@{/js/sidebar.js}"></script>
</body>

</html>
