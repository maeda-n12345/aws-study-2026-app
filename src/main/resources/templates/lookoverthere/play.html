<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>あっちむいてほい</title>

  <link rel="stylesheet" th:href="@{/css/base.css}">
  <link rel="stylesheet" th:href="@{/css/layout.css}">
  <link rel="stylesheet" th:href="@{/css/lookoverthere.css}">
  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>

<body>
  <div class="layout">
    <div id="overlay" class="overlay"></div>
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- 対戦画面 -->
    <main id="play-screen" class="lookoverthere-container">
      <h1>あっちむいてほい</h1>

      <div class="opponent">
        <img th:src="@{/images/face_ready.png}" alt="対戦相手" class="opponent-img">
      </div>

      <p class="direction-message">
        方向を選んでください
      </p>

      <form id="play-form" th:action="@{/lookoverthere/play}" method="post">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="direction-cross">
          <label class="direction-button up">
            <input type="radio" id="dir-up" name="direction" value="UP" required>
            <span>↑</span>
          </label>

          <label class="direction-button left">
            <input type="radio" id="dir-left" name="direction" value="LEFT">
            <span>←</span>
          </label>

          <label class="direction-button right">
            <input type="radio" id="dir-right" name="direction" value="RIGHT">
            <span>→</span>
          </label>

          <label class="direction-button down">
            <input type="radio" id="dir-down" name="direction" value="DOWN">
            <span>↓</span>
          </label>
        </div>

        <button type="submit" class="battle-button">
          勝負！
        </button>
      </form>
    </main>

    <!-- 結果画面：昨年度のresult.htmlと同じ構造 -->
    <main id="result-screen" class="container" style="display:none;">
      <div class="lookoverthere-container result-container">

        <h1>対戦結果</h1>

        <div class="result-main">
          <div class="opponent-wrapper">
            <img id="result-opponent-img" th:src="@{/images/face_ready.png}" alt="対戦相手" class="opponent-img">
          </div>
        </div>

        <div class="result-info">
          <p class="opponent-direction">
            相手の向き：<span id="opponent-direction"></span>
          </p>
          <p class="your-direction">
            あなたの向き：<span id="player-direction"></span>
          </p>
        </div>

        <div id="result-text" class="result-text">
          あなたの
          <span id="result-label"></span>
        </div>

        <div class="result-actions">
          <form id="retry-form" th:action="@{/lookoverthere/play}" method="get">
            <button type="submit">続ける</button>
          </form>

          <form th:action="@{/home}" method="get">
            <button>やめる</button>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script th:src="@{/js/look-over-there.js}"></script>
  <script th:src="@{/js/sidebar.js}"></script>
</body>

</html>
